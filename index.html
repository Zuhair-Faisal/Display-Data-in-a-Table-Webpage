<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Displaying Data in a Table</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <h1>Users</h1>
    <table id="myTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Address</th>
            </tr>    
        </thead>
        <tbody id="userData"></tbody>
    </table>
    <script src="JS/script.js"></script>
</body>
</html>
