<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Displaying Data in a Table</title>
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <header><h1>Users Management</h1></header>
    <main>
      <div class="cards">
        <section class="card">
          <h2>Find a User</h2>
          <input
            type="number"
            id="userIdInput"
            placeholder="Enter user ID (1-10)"
          />
          <button id="searchBtn">Search</button>
          <div id="singleUser"></div>
        </section>
        <section class="card">
          <h2>Create a User</h2>
          <form id="createUserForm">
            <label for="nameInput">Name</label>
            <input type="text" id="nameInput" required />
            <label for="emailInput">Email</label>
            <input type="email" id="emailInput" required />
            <label for="phoneInput">Phone</label>
            <input
              type="tel"
              id="phoneInput"
            />
            <label for="userAddress">City</label>
            <input type="text" id="userAddress" />
            <button type="submit">Create User</button>
          </form>
          <div id="newUser"></div>
        </section>
      </div>

      <section class="card">
        <h2>Edit a User</h2>
        <p id="editInfo">Click "Edit" on a user in the table.</p>
        <form id="editUserForm">
          <label for="editName">Name</label>
          <input type="text" id="editName" />
          
          <label for="editEmail">Email</label>
          <input type="email" id="editEmail" />
          
          <label for="editPhone">Phone</label>
          <input type="tel" id="editPhone" />

          <label for="editCity">Address</label>
          <input for="text" id="editCity" />
          <div class="button-row">
            <button type="button" id="putBtn">Replace (PUT)</button>
            <button type="button" id="patchBtn">Update (PATCH)</button>
          </div>
        </form>
        <pre id="editResult"></pre>
      </section>

      <h2>All Users</h2>  
      <table id="usersTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Address</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userData">
          
        </tbody>
    </main>
    <script src="JS/script.js"></script>
  </body>
</html>
